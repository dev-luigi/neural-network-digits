# CI: at every push to main or develop and at every pull request it runs the tests on Windows, Linux and
# macOS, with the oldest supported Python version and with the newest one.
# release.yml uses it too, before publishing a version.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Libraries
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Test (Windows, macOS)
        if: runner.os != 'Linux'
        run: python -m pytest -v

      # On Linux there is no screen: xvfb simulates one so the graphical interface is tested too
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a python -m pytest -v

      # start.sh as a user runs it: it creates .venv, installs the libraries there and starts the program
      - name: start.sh (Linux, macOS)
        if: runner.os != 'Windows'
        run: ./start.sh --version
